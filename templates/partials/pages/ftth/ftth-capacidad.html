<div class="page" id="page-ftth-capacidad">
  <div class="card">
    <div class="stitle">💡 Capacidad y salud de PONs
      <small style="margin-left:auto;color:var(--txt2);font-weight:400">Ocupación del split y salud óptica de cada PON, por OLT</small>
    </div>
    <div id="fcap-resumen" style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem"></div>
    <div style="margin-bottom:.6rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-gray btn-sm" onclick="cargarFtthCapacidad()">🔄 Refrescar</button>
      <select id="fcap-filtro" onchange="renderFtthCapacidad()" style="padding:.4rem;border:1px solid var(--brd);border-radius:6px">
        <option value="">Todos los estados</option>
        <option value="critico">🔴 Críticos</option>
        <option value="advertencia">🟡 Advertencia</option>
        <option value="normal">🟢 Normales</option>
        <option value="sin_datos">⚫ Sin datos</option>
      </select>
      <small style="color:var(--txt2)">El split por OLT se configura en la ficha de la OLT (por defecto 64).</small>
    </div>
    <div id="fcap-lista"><div style="color:var(--txt2)">Cargando…</div></div>
  </div>
</div>
