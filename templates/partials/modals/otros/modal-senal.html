<div id="modal-senal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeModal('modal-senal')">
<div class="modal" style="max-width:550px">
  <div class="modal-hd"><span id="msenal-title">Historial de Señal</span><button class="modal-close" onclick="closeModal('modal-senal')">×</button></div>
  <div class="modal-bd">
    <input type="hidden" id="msenal-nap">
    <div style="display:flex;gap:.5rem;margin-bottom:.6rem">
      <input id="msenal-dbm" type="number" step="0.1" placeholder="-20.5" style="width:120px;font-family:monospace">
      <span style="line-height:2;font-size:.8rem">dBm</span>
      <input id="msenal-obs" placeholder="Observaciones (opcional)" style="flex:1">
      <button class="btn btn-prim btn-sm" onclick="registrarSenal()">📝 Registrar</button>
    </div>
    <div id="msenal-history" style="max-height:300px;overflow-y:auto"></div>
  </div>
</div>
</div>
