<div id="modal-solicitar-vac" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeModal('modal-solicitar-vac')">
<div class="modal" style="max-width:420px">
  <div class="modal-hd"><span>🏖 Solicitar vacaciones</span><button class="modal-close" onclick="closeModal('modal-solicitar-vac')">×</button></div>
  <div class="modal-bd">
    <div id="solvac-saldo" style="background:var(--tint-verde);border-radius:6px;padding:.5rem;font-size:.85rem;font-weight:600;color:#2e7d32;margin-bottom:.6rem"></div>
    <div id="solvac-desglose" style="font-size:.78rem;margin-bottom:.6rem"></div>
    <div id="solvac-historial" style="font-size:.76rem;margin-bottom:.7rem"></div>
    <label style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;margin-bottom:.6rem;cursor:pointer">
      <input type="checkbox" id="solvac-medio" onchange="toggleMedioDiaSol()"> Medio día (0,5)
    </label>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.6rem">
      <div><label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Desde</label>
        <input type="date" id="solvac-desde" onchange="calcDiasSolVac()" style="width:100%;padding:.5rem;border:1px solid var(--brd);border-radius:6px"></div>
      <div id="solvac-hasta-wrap"><label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Hasta</label>
        <input type="date" id="solvac-hasta" onchange="calcDiasSolVac()" style="width:100%;padding:.5rem;border:1px solid var(--brd);border-radius:6px"></div>
    </div>
    <div style="margin-bottom:.6rem;font-size:.82rem;color:var(--txt2)">Días solicitados: <b id="solvac-dias">—</b></div>
    <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Período al que corresponden</label>
    <select id="solvac-periodo" style="width:100%;padding:.5rem;border:1px solid var(--brd);border-radius:6px;margin-bottom:.6rem"></select>
    <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.2rem">Motivo / comentario (opcional)</label>
    <textarea id="solvac-motivo" rows="2" style="width:100%;padding:.5rem;border:1px solid var(--brd);border-radius:6px"></textarea>
    <div style="font-size:.72rem;color:var(--txt2);margin-top:.4rem">La solicitud queda pendiente hasta que RRHH la autorice.</div>
  </div>
  <div class="modal-ft">
    <button class="btn btn-gray" onclick="closeModal('modal-solicitar-vac')">Cancelar</button>
    <button class="btn btn-prim" onclick="enviarSolicitudVac()">Enviar solicitud</button>
  </div>
</div>
</div>
