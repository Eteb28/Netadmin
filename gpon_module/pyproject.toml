[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpon-module"
version = "0.10.5"
description = "Administración GPON multifabricante (VSOL, ZTE), integrable con Pucará"
requires-python = ">=3.11"
license = { text = "Propietario" }

# Deliberadamente mínimas. El núcleo, la base SQLite, el driver simulado y toda
# la batería de tests funcionan sólo con la biblioteca estándar más
# 'cryptography', que existe para no guardar credenciales de OLT en claro.
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
# Fase 2: transporte real hacia las OLT.
equipos = [
    "pysnmp>=6.1",
    "paramiko>=3.4",
]
# Fase 3: interfaz web.
web = [
    "flask>=3.0",
]
# Fase 4: PostgreSQL para el volumen del histórico.
postgres = [
    "psycopg2-binary>=2.9",
]
desarrollo = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
gpon = "gpon_module.cli:main"

[tool.setuptools]
# El paquete vive en este mismo directorio: 'gpon_module/' es a la vez la raíz
# del proyecto y del paquete, que es la estructura acordada en el diseño.
package-dir = { "gpon_module" = "." }
packages = [
    "gpon_module",
    "gpon_module.core",
    "gpon_module.drivers",
    "gpon_module.drivers.mock",
    "gpon_module.drivers.transport",
    "gpon_module.drivers.vsol",
    "gpon_module.database",
    "gpon_module.database.repositories",
    "gpon_module.services",
    "gpon_module.api",
    "gpon_module.web",
]

[tool.setuptools.package-data]
"gpon_module" = ["equipos.toml.ejemplo"]
"gpon_module.database" = ["*.sql"]
"gpon_module.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Los mensajes de error van en castellano y con acentos: son para el
    # operador, no para un log en inglés.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Los tests acceden a atributos internos para inyectar fallas a propósito.
"gpon_module/tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
