{% extends "base.html" %}
{% block titulo %}ONU{% endblock %}

{% block contenido %}
<nav aria-label="ruta"><ol class="breadcrumb small">
  <li class="breadcrumb-item"><a href="/olts" class="link-secondary">OLT</a></li>
  <li class="breadcrumb-item"><a href="/olts/{{ olt_id }}" class="link-secondary" id="miga-olt">…</a></li>
  <li class="breadcrumb-item active">ONU</li>
</ol></nav>

<div class="row g-2 align-items-end mb-3">
  <div class="col-md-3">
    <label class="form-label small text-secondary mb-1">Buscar</label>
    <input class="form-control form-control-sm" id="buscar" placeholder="cliente, serie o 3:12">
  </div>
  <div class="col-6 col-md-2">
    <label class="form-label small text-secondary mb-1">Puerto PON</label>
    <select class="form-select form-select-sm" id="pon"><option value="">Todos</option></select>
  </div>
  <div class="col-6 col-md-2">
    <label class="form-label small text-secondary mb-1">Estado</label>
    <select class="form-select form-select-sm" id="estado">
      <option value="">Todos</option>
      <option value="en_linea">En línea</option>
      <option value="fuera_de_linea">Fuera de línea</option>
      <option value="desconocido">Desconocido</option>
    </select>
  </div>
  <div class="col-md-5 text-md-end">
    <span class="text-secondary small" id="conteo"></span>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0 tabla-compacta" id="tabla">
      <thead><tr>
        <th data-orden="ref">ONU</th>
        <th data-orden="nombre">Nombre</th>
        <th data-orden="numero_serie">Serie</th>
        <th data-orden="estado">Estado</th>
        <th data-orden="motivo_caida">Motivo</th>
        <th data-orden="tiempo_en_estado">En ese estado</th>
        <th data-orden="ultima_subida">Última subida</th>
      </tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
</div>

<nav class="mt-3"><ul class="pagination pagination-sm" id="paginas"></ul></nav>
{% endblock %}

{% block guion %}
<script>
const OLT_ID = {{ olt_id }};
const POR_PAGINA = 100;
let desplazamiento = 0;
let filas = [];

const parametros = new URLSearchParams(location.search);

async function iniciar() {
  const olt = await api(`/olts/${OLT_ID}`);
  document.getElementById('miga-olt').textContent = olt.nombre;

  const puertos = await api(`/olts/${OLT_ID}/puertos`);
  const selector = document.getElementById('pon');
  puertos.forEach((p) => selector.add(new Option(p.nombre || `PON ${p.indice}`, p.indice)));
  if (parametros.get('pon')) selector.value = parametros.get('pon');

  ['buscar', 'pon', 'estado'].forEach((id) => {
    document.getElementById(id).addEventListener('input', () => { desplazamiento = 0; cargar(); });
  });
  cargar();
}

async function cargar() {
  const buscar = document.getElementById('buscar').value.trim();
  const pon = document.getElementById('pon').value;
  const estado = document.getElementById('estado').value;

  const consulta = new URLSearchParams({ limite: POR_PAGINA, desplazamiento });
  if (buscar) consulta.set('buscar', buscar);
  if (pon) consulta.set('pon', pon);
  if (estado) consulta.set('estado', estado);

  const pagina = await api(`/olts/${OLT_ID}/onus?${consulta}`);
  filas = pagina.resultados;
  dibujar();

  const hasta = Math.min(desplazamiento + POR_PAGINA, pagina.total);
  document.getElementById('conteo').textContent =
    pagina.total ? `${desplazamiento + 1}–${hasta} de ${pagina.total} ONU` : 'Sin resultados';
  dibujarPaginas(pagina.total);
}

function dibujar() {
  document.getElementById('filas').innerHTML = filas.map((o) => `
    <tr onclick="location.href='/olts/${OLT_ID}/onus/${o.pon}/${o.onu_id}'">
      <td class="monoespaciada">${escapar(o.ref)}</td>
      <td>${valor(o.nombre)}</td>
      <td class="monoespaciada">${valor(o.numero_serie)}</td>
      <td>${insigniaEstado(o.estado)}</td>
      <td>${insigniaMotivo(o.motivo_caida)}</td>
      <td class="monoespaciada">${valor(o.tiempo_en_estado)}</td>
      <td class="text-nowrap">${fecha(o.ultima_subida)}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="text-center text-secondary py-4">Sin ONU. ¿Corriste "Descubrir"?</td></tr>';
}

function dibujarPaginas(total) {
  const paginas = Math.ceil(total / POR_PAGINA);
  if (paginas <= 1) { document.getElementById('paginas').innerHTML = ''; return; }
  const actual = Math.floor(desplazamiento / POR_PAGINA);
  let html = '';
  for (let i = 0; i < paginas; i++) {
    if (i > 2 && i < paginas - 3 && Math.abs(i - actual) > 1) {
      if (i === 3) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
      continue;
    }
    html += `<li class="page-item ${i === actual ? 'active' : ''}">
      <a class="page-link" href="#" onclick="irA(${i * POR_PAGINA});return false;">${i + 1}</a></li>`;
  }
  document.getElementById('paginas').innerHTML = html;
}

function irA(nuevo) { desplazamiento = nuevo; cargar(); window.scrollTo(0, 0); }

habilitarOrden(document.getElementById('tabla'), filas, dibujar);
iniciar().catch((error) => avisar(error.message, 'danger'));
</script>
{% endblock %}
